<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>경력 번역기 상담 도구</title>
<meta name="description" content="생활 경험에서 직무 역량의 근거를 찾아 채용공고의 언어로 옮기는 직업상담 도구">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>📋</text></svg>">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="titlerow">
      <h1>경력 번역기</h1>
      <span class="ver">상담 도구판 · 설계 v1.2 기반</span>
    </div>
    <p class="sub">생활 경험에서 직무 역량의 근거를 찾아 채용공고의 언어로 옮깁니다. 인출 → 매핑 → 번역 세 단계를 상담 중에 그대로 따라갈 수 있게 만든 도구입니다.</p>
    <nav class="rail" role="tablist" id="rail"></nav>
  </div>
</header>

<div class="wrap">
  <div class="notice">
    <strong>AI 산출물을 구직자에게 그대로 전달하지 마십시오.</strong> 상담사가 사실을 확인하고 표현을 점검한 뒤에 전달합니다.
    성명·생년월일·연락처·주소·가족 신상은 입력하지 않습니다. 상담 녹취를 붙여넣지 말고, 상담사가 정리한 내용만 적습니다.
    입력 내용은 이 브라우저에만 저장됩니다.
  </div>
  <main id="main"></main>
  <footer>
    <span>입력은 이 브라우저에 자동 저장됩니다.</span>
    <span class="row tight">
      <button class="btn sm ghost" id="themeBtn">화면 밝기 바꾸기</button>
      <button class="btn sm ghost" id="resetAll">상담 기록 전체 지우기</button>
    </span>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
